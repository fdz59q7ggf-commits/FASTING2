<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>斷食計時器</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b1220" />
<style>
  :root {
    --bg: #0b1220;
    --card: #121a2b;
    --card-border: #223049;
    --card-border-hover: #2dd4bf;
    --text: #eef2f7;
    --text-dim: #8b96a8;
    --text-faint: #566178;

    --teal: #2dd4bf;
    --coral: #fb7185;
    --amber: #f2b134;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --slate: #3a4459;
    --danger: #ef4444;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;

    --nav-h: 62px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #05070c;
    color: var(--text);
    font-family: var(--sans);
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
  }
  #app {
    width: 100%; max-width: 480px; margin: 0 auto;
    height: 100vh;
    height: 100svh;
    background: var(--bg);
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* 桌機/較寬螢幕：呈現手機外框樣式，避免內容被拉伸到滿版 */
  @media (min-width: 620px) {
    #app {
      height: min(100svh, 860px);
      max-height: 860px;
      margin: 20px auto;
      border-radius: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    }
  }

  .view {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    min-width: 0;
    padding: 14px 16px calc(var(--nav-h) + 14px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .view.active { display: flex; }
  /* 記錄畫面與統計畫面：整體不捲動，只有內部清單/圖表區塊可捲動 */
  #input-view, #chart-view { overflow: hidden; }
  .scroll-region { flex: 1; min-height: 0; overflow-y: auto; }

  /* ---------- shared ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: var(--transition);
  }
  .card:hover {
    border-color: var(--card-border-hover);
    box-shadow: 0 0 20px rgba(45, 212, 191, 0.15);
  }
  .page-title {
    font-size: 15px; font-weight: 800; text-align: center;
    margin: 2px 0 10px; letter-spacing: 0.02em; flex-shrink: 0;
  }
  .offline-badge {
    display: none; text-align: center; font-size: 10px; color: var(--text-dim);
    background: var(--card); border: 1px solid var(--card-border); border-radius: 999px;
    padding: 3px 9px; width: fit-content; margin: 0 auto 8px; font-family: var(--mono);
    flex-shrink: 0;
  }
  .offline-badge.show { display: block; }

  /* ================= HOME VIEW（不超出螢幕）================= */
  #home-view { justify-content: flex-start; }
  .home-main-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .setup-row { display: flex; gap: 8px; min-width: 0; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 10px; color: var(--text-dim); }
  .field select, .field input {
    font-family: var(--sans); font-size: 13px; padding: 7px 8px;
    border-radius: 9px; border: 1px solid var(--card-border);
    background: #0e1728; color: var(--text);
    transition: var(--transition);
  }
  .field select:focus, .field input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
    background: rgba(14, 23, 40, 0.8);
  }

  .ring-section {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; min-height: 0;
  }
  .ring-wrap { position: relative; width: 248px; height: 248px; margin: 6px 0; max-width: 78vw; max-height: 78vw; }
  .ring-bg {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--teal) calc(var(--pct, 0) * 1%), #1b2438 0);
  }
  .ring-inner {
    position: absolute; inset: 13px; border-radius: 50%;
    background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pct-text { font-size: 12px; color: var(--text-dim); margin-bottom: 3px; font-family: var(--mono); }
  .elapsed-text { font-size: 31px; font-weight: 700; font-family: var(--mono); }
  .goal-text { font-size: 11px; color: var(--text-faint); margin-top: 5px; font-family: var(--mono); }
  .badge {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 800; color: #06101f;
    transform: translate(-50%, -50%);
    border: 2px solid var(--card);
    font-family: var(--mono);
  }
  .badge.done { background: var(--teal); }
  .badge.current { background: var(--coral); color: #2a0a10; box-shadow: 0 0 0 3px rgba(251,113,133,0.22); }
  .badge.todo { background: var(--slate); color: var(--text-dim); }

  .controls { display: flex; gap: 8px; margin-top: 4px; flex-shrink: 0; }
  button { font-family: var(--sans); border: none; cursor: pointer; border-radius: 12px; font-weight: 700; font-size: 14px; transition: var(--transition); }
  .btn-primary { flex: 2; background: var(--teal); color: #04211c; padding: 11px; }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3); transform: translateY(-1px); }
  .btn-primary:active { opacity: 0.9; transform: translateY(0); }
  .btn-secondary { flex: 1; background: #182337; border: 1px solid var(--card-border); color: var(--text); padding: 11px; transition: var(--transition); }
  .btn-secondary:hover { border-color: var(--teal); background: rgba(45, 212, 191, 0.05); }
  .btn-secondary:active { opacity: 0.8; }

  .startend { display: flex; justify-content: space-between; font-size: 11px; margin-top: 8px; color: var(--text-faint); font-family: var(--mono); flex-shrink: 0; }
  .startend b { color: var(--text); font-weight: 700; }

  .phase-mini {
    display: flex; align-items: center; gap: 10px;
    border-left: 3px solid var(--coral);
    flex-shrink: 0;
  }
  .phase-mini .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); flex-shrink: 0; }
  .phase-mini-body { min-width: 0; }
  .phase-mini-title { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
  .phase-mini-desc {
    font-size: 11.5px; color: var(--text-dim); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ================= INPUT VIEW ================= */
  .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); animation: pulse-beat 1.1s ease-in-out infinite; }
  @keyframes pulse-beat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none; } }

  .bio-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; min-width: 0; }
  .bio-form .field { min-width: 0; }
  .bio-form input { min-width: 0; width: 100%; }
  .bio-add-btn { grid-column: 1 / -1; background: var(--teal); color: #04211c; padding: 11px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; transition: var(--transition); cursor: pointer; border: none; }
  .bio-add-btn:hover { box-shadow: 0 4px 12px rgba(45, 212, 191, 0.3); transform: translateY(-1px); }
  .bio-add-btn:active { opacity: 0.9; transform: translateY(0); }

  .bio-list { display: flex; flex-direction: column; gap: 8px; }
  .bio-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #0e1728; border: 1px solid var(--card-border); border-radius: 12px;
    padding: 8px 10px; font-size: 13px;
    transition: var(--transition);
  }
  .bio-item:hover {
    border-color: var(--teal);
    box-shadow: 0 2px 8px rgba(45, 212, 191, 0.1);
  }
  .bio-item .bio-time { color: var(--text-faint); font-size: 10px; font-family: var(--mono); }
  .bio-item .bio-vals { display: flex; gap: 8px; font-weight: 600; font-family: var(--mono); font-size: 11.5px; flex-wrap: wrap; }
  .bio-item .bio-remove { background: transparent; color: var(--text-faint); font-size: 16px; padding: 2px 4px; border: none; cursor: pointer; transition: color 0.2s; }
  .bio-item .bio-remove:hover { color: var(--danger); }
  .btn-clear-data { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; transition: var(--transition); }
  .btn-clear-data:hover { background: rgba(239, 68, 68, 0.3); box-shadow: 0 2px 8px rgba(239, 68, 68, 0.2); }
  .btn-clear-data:active { opacity: 0.8; }
  .empty-hint { text-align: center; color: var(--text-faint); font-size: 13px; padding: 14px 0; }

  /* ================= CHART VIEW ================= */
  .stats-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .stats-card { background: #0e1728; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; transition: var(--transition); }
  .stats-card:hover { border-color: var(--card-border-hover); box-shadow: 0 2px 8px rgba(45, 212, 191, 0.1); }
  .stats-label { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-bottom: 4px; }
  .stats-value { font-size: 18px; font-weight: 700; font-family: var(--mono); color: var(--teal); margin-bottom: 4px; }
  .stats-change { font-size: 11px; font-family: var(--mono); color: var(--text-faint); }
  .stats-change.positive { color: #22c55e; }
  .stats-change.negative { color: var(--danger); }

  .history-card { padding: 12px 14px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    background: #0e1728; border: 1px solid var(--card-border); border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .history-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .history-date { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .history-duration { font-size: 12px; font-weight: 700; color: var(--teal); font-family: var(--mono); }
  .history-meta { font-size: 11px; color: var(--text-dim); }
  .history-empty { font-size: 12px; color: var(--text-faint); text-align: center; padding: 8px 0; }
  
  .chart-grid { display: flex; flex-direction: column; gap: 12px; }
  .chart-card { background: #0e1728; border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 14px; flex-shrink: 0; transition: var(--transition); }
  .chart-card:hover { border-color: var(--card-border-hover); box-shadow: 0 2px 8px rgba(45, 212, 191, 0.1); }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .chart-label { font-size: 12px; color: var(--text-dim); font-weight: 700; }
  .chart-latest { font-size: 15px; font-weight: 700; font-family: var(--mono); }
  .chart-legend { display: flex; gap: 10px; font-size: 10px; color: var(--text-faint); margin-top: 4px; font-family: var(--mono); }
  .legend-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .chart-empty { font-size: 12px; color: var(--text-faint); text-align: center; padding: 14px 0; }
  svg.sparkline { width: 100%; height: 60px; display: block; }

  .disclaimer { font-size: 10.5px; color: var(--text-faint); text-align: center; line-height: 1.7; margin-top: 12px; flex-shrink: 0; }

  /* ================= BOTTOM NAV ================= */
  .tab-bar {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: var(--nav-h);
    background: rgba(18, 26, 43, 0.92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--card-border);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab-btn {
    flex: 1; background: transparent; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--text-faint); font-size: 10.5px; font-weight: 700; font-family: var(--sans);
    padding: 6px 0 0;
    transition: var(--transition);
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn .tab-icon { font-size: 19px; line-height: 1; transition: var(--transition); }
  .tab-btn.active { color: var(--teal); }
  .tab-btn.active .tab-icon { filter: drop-shadow(0 0 6px rgba(45,212,191,0.5)); transform: scale(1.1); }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== HOME VIEW ===================== -->
  <div class="view active" id="home-view">
    <div class="offline-badge" id="offlineBadge">OFFLINE · 持續計時中</div>

    <div class="card home-main-card">
      <div class="setup-row">
        <div class="field">
          <label>斷食開始時間</label>
          <input type="datetime-local" id="startInput" />
        </div>
        <div class="field">
          <label>目標時數</label>
          <select id="goalSelect">
            <option value="16">16 小時</option>
            <option value="18">18 小時</option>
            <option value="20">20 小時</option>
            <option value="24">24 小時（1天）</option>
            <option value="36">36 小時（1.5天）</option>
            <option value="48">48 小時（2天）</option>
            <option value="72">72 小時（3天）</option>
            <option value="96">96 小時（4天）</option>
            <option value="120" selected>120 小時（5天）</option>
            <option value="144">144 小時（6天）</option>
            <option value="168">168 小時（7天）</option>
            <option value="192">192 小時（8天）</option>
            <option value="216">216 小時（9天）</option>
            <option value="240">240 小時（10天）</option>
            <option value="264">264 小時（11天）</option>
            <option value="288">288 小時（12天）</option>
            <option value="312">312 小時（13天）</option>
            <option value="336">336 小時（14天）</option>
          </select>
        </div>
      </div>

      <div class="ring-section">
        <div class="ring-wrap" id="ringWrap">
          <div class="ring-bg" id="ringBg"></div>
          <div class="ring-inner">
            <div class="pct-text" id="pctText">已過時間 0%</div>
            <div class="elapsed-text" id="elapsedText">00:00:00</div>
            <div class="goal-text" id="goalText">目標 120 小時</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn">開始斷食</button>
        <button class="btn-secondary" id="endBtn">結束斷食</button>
      </div>

      <div class="startend">
        <span>開始 <b id="startLabel">—</b></span>
        <span>預計結束 <b id="endLabel">—</b></span>
      </div>
    </div>

    <div class="card phase-mini">
      <div class="dot"></div>
      <div class="phase-mini-body">
        <div class="phase-mini-title" id="phaseTitle">尚未開始</div>
        <div class="phase-mini-desc" id="phaseDesc">設定時間後按「開始斷食」，即可看到目前身體階段。</div>
      </div>
    </div>
  </div>

  <!-- ===================== INPUT VIEW ===================== -->
  <div class="view" id="input-view">
    <div class="page-title">📋 記錄數據</div>
    <div class="card">
      <div class="section-title"><span class="pulse-dot"></span> 體重 / 心跳 / 血糖 / 血壓</div>
      <div class="bio-form">
        <div class="field">
          <label>體重 (kg)</label>
          <input type="number" step="0.1" id="weightInput" placeholder="65.5" />
        </div>
        <div class="field">
          <label>心跳 (bpm)</label>
          <input type="number" step="1" id="hrInput" placeholder="72" />
        </div>
        <div class="field">
          <label>血糖 (mg/dL)</label>
          <input type="number" step="1" id="glucoseInput" placeholder="95" />
        </div>
        <div class="field" style="display:flex; flex-direction:row; gap:6px; min-width:0;">
          <div style="flex:1; min-width:0;">
            <label style="display:block; font-size:10px; color:var(--text-dim); margin-bottom:4px;">收縮壓</label>
            <input type="number" step="1" id="sysInput" placeholder="120" style="width:100%; min-width:0;" />
          </div>
          <div style="flex:1; min-width:0;">
            <label style="display:block; font-size:10px; color:var(--text-dim); margin-bottom:4px;">舒張壓</label>
            <input type="number" step="1" id="diaInput" placeholder="80" style="width:100%; min-width:0;" />
          </div>
        </div>
        <button class="bio-add-btn" id="bioAddBtn">＋ 新增記錄</button>
      </div>
    </div>
    <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;">
      <div class="section-title" style="flex-shrink:0;">歷史紀錄</div>
      <div class="bio-list scroll-region" id="bioList"></div>
      <div style="display:flex; gap:8px; margin-top:8px; flex-shrink:0;">
        <button class="btn-secondary" id="exportDataBtn" style="flex:1; padding:10px 12px;">📤 匯出資料</button>
        <button class="btn-secondary" id="importDataBtn" style="flex:1; padding:10px 12px;">📥 匯入資料</button>
      </div>
      <button class="btn-clear-data" id="clearDataBtn" style="margin-top:8px; flex-shrink:0;">🗑️ 清空所有數據</button>
      <input type="file" id="importFileInput" accept="application/json,.json" hidden />
    </div>
  </div>

  <!-- ===================== CHART VIEW ===================== -->
  <div class="view" id="chart-view">
    <div class="page-title" style="flex-shrink:0;">📈 趨勢統計</div>
    <div class="stats-summary" id="statsSummary" style="flex-shrink:0;"></div>
    <div class="card history-card" style="flex-shrink:0;">
      <div class="section-title" style="margin-bottom:8px;">⏱️ 斷食歷史紀錄</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <div class="chart-grid scroll-region" id="chartGrid"></div>
    <div class="disclaimer" style="flex-shrink:0;">
      各階段之身體變化說明僅供一般參考，並非醫療建議。超過 24–48 小時的長時間斷食建議在醫師或營養師監督下進行；若有糖尿病、低血糖、心血管疾病、服用藥物、懷孕或曾有飲食失調經驗，請先諮詢專業醫療人員。若斷食期間感到頭暈、心悸、極度不適，請立即停止並補充飲食。
    </div>
  </div>

  <!-- ===================== TAB BAR ===================== -->
  <div class="tab-bar">
    <button class="tab-btn active" data-view="home-view">
      <span class="tab-icon">⏱</span>首頁
    </button>
    <button class="tab-btn" data-view="input-view">
      <span class="tab-icon">✏️</span>記錄
    </button>
    <button class="tab-btn" data-view="chart-view">
      <span class="tab-icon">📈</span>統計
    </button>
  </div>

</div>

<script>
/* ---------------- 頁籤切換 ---------------- */
const tabBtns = document.querySelectorAll('.tab-btn');
const views = document.querySelectorAll('.view');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.getAttribute('data-view');
    views.forEach(v => v.classList.toggle('active', v.id === target));
    tabBtns.forEach(b => b.classList.toggle('active', b === btn));
    if (target === 'chart-view') renderCharts();
    if (target === 'input-view') renderBioList();
  });
});

/* ---------------- 階段資料 ---------------- */
const PHASES = [
  { hours: 0,   title: '消化期',          desc: '身體正在消化與吸收食物，血糖與胰島素處於較高水平，主要以葡萄糖作為能量來源。' },
  { hours: 4,   title: '血糖趨於穩定',     desc: '血糖與胰島素濃度開始下降，身體逐漸動用肝臟中的肝醣儲備來維持能量。' },
  { hours: 12,  title: '肝醣持續消耗',     desc: '肝醣儲備持續減少，身體開始增加脂肪分解，作為能量補充來源。' },
  { hours: 16,  title: '燃脂逐漸啟動',     desc: '肝醣接近耗盡，身體逐漸轉換為以脂肪作為主要燃料來源，這也是常見 16:8 斷食法鎖定的階段。' },

const MILESTONES = [12, 24, 36, 48, 72, 96, 120, 144, 168, 192, 216, 240, 264, 288, 312, 336];

/* ---------------- 狀態管理 ---------------- */
const STATE_KEY = 'fastTimerState_v1';
const BIO_KEY = 'fastBiometrics_v2';
const FASTING_HISTORY_KEY = 'fastingHistory_v1';

let state = { running: false, startTime: null, goalHours: 120 };
let bioRecords = [];
let fastingHistory = [];

function loadState() {
  try { const raw = localStorage.getItem(STATE_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  try {
    const raw2 = localStorage.getItem(BIO_KEY);
    if (raw2) { bioRecords = JSON.parse(raw2); }
    else {
      const old = localStorage.getItem('fastBiometrics_v1');
      if (old) bioRecords = JSON.parse(old).map(r => ({ ...r, hr: r.hr || null }));
    }
  } catch (e) {}
  try {
    const raw3 = localStorage.getItem(FASTING_HISTORY_KEY);
    if (raw3) fastingHistory = JSON.parse(raw3);
  } catch (e) {}
}
function saveState() { try { localStorage.setItem(STATE_KEY, JSON.stringify(state)); } catch (e) {} }
function saveBio() { try { localStorage.setItem(BIO_KEY, JSON.stringify(bioRecords)); } catch (e) {} }
function saveFastingHistory() { try { localStorage.setItem(FASTING_HISTORY_KEY, JSON.stringify(fastingHistory)); } catch (e) {} }
function exportCurrentData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 1,
    state,
    bioRecords,
    fastingHistory
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fasting-data-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function applyImportedData(data) {
  if (!data || typeof data !== 'object') {
    throw new Error('匯入資料格式錯誤');
  }

  if (Array.isArray(data.bioRecords)) bioRecords = data.bioRecords;
  if (Array.isArray(data.fastingHistory)) fastingHistory = data.fastingHistory;
  if (data.state && typeof data.state === 'object') {
    state = { ...state, ...data.state };
    if (typeof state.goalHours === 'number' && state.goalHours > 0) {
      goalSelect.value = String(state.goalHours);
    }
  }

  saveBio();
  saveFastingHistory();
  saveState();
  renderBioList();
  renderCharts();
  updateDisplay();
}

function importCurrentData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || ''));
      applyImportedData(parsed);
      alert('✅ 資料匯入成功');
    } catch (error) {
      alert('匯入失敗：檔案格式不是有效的斷食資料 JSON');
    }
  };
  reader.readAsText(file);
}

/* ---------------- 工具 ---------------- */
function toLocalDatetimeInputValue(ms) {
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtHMS(totalSeconds) {
  totalSeconds = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDateShort(ms) {
  const d = new Date(ms);
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function getPhase(elapsedHours) {
  let ph = PHASES[0];
  for (const p of PHASES) { if (elapsedHours >= p.hours) ph = p; }
  return ph;
}
function notify(text) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('斷食計時器', { body: text }); } catch (e) {}
  }
}

/* ---------------- 徽章渲染 ---------------- */
function renderBadges(elapsedHours, goalHours) {
  ringWrap.querySelectorAll('.badge').forEach(b => b.remove());
  const maxScale = Math.max(goalHours, ...MILESTONES.filter(m => m <= goalHours * 1.4));
  const relevant = MILESTONES.filter(m => m <= maxScale);
  const wrapSize = ringWrap.clientWidth || 248;
  const center = wrapSize / 2;
  const radius = center - 18;
  relevant.forEach((m) => {
    const angleDeg = (m / maxScale) * 360 - 90;
    const rad = (angleDeg * Math.PI) / 180;
    const x = center + radius * Math.cos(rad);
    const y = center + radius * Math.sin(rad);
    const badge = document.createElement('div');
    let cls = 'todo';
    if (elapsedHours >= m) cls = 'done';
    const currentPhase = getPhase(elapsedHours);
    if (currentPhase.hours === m) cls = 'current';
    badge.className = 'badge ' + cls;
    badge.style.left = x + 'px';
    badge.style.top = y + 'px';
    badge.textContent = m;
    ringWrap.appendChild(badge);
  });
}

/* ---------------- 主計時顯示 ---------------- */
function updateDisplay() {
  const goalHours = Number(goalSelect.value) || 24;
  state.goalHours = goalHours;

  if (!state.running || !state.startTime) {
    pctText.textContent = '已過時間 0%';
    elapsedText.textContent = '00:00:00';
    goalText.textContent = '目標 ' + goalHours + ' 小時';
    ringBg.style.setProperty('--pct', 0);
    startLabel.textContent = '—';
    endLabel.textContent = '—';
    phaseTitle.textContent = '尚未開始';
    phaseDesc.textContent = '設定時間後按「開始斷食」，即可看到目前身體階段。';
    renderBadges(0, goalHours);
    return;
  }

  const nowMs = Date.now();
  const elapsedMs = nowMs - state.startTime;
  const elapsedSec = elapsedMs / 1000;
  const elapsedHours = elapsedSec / 3600;
  const pct = Math.min(100, (elapsedHours / goalHours) * 100);

  pctText.textContent = '已過時間 ' + pct.toFixed(0) + '%';
  elapsedText.textContent = fmtHMS(elapsedSec);
  goalText.textContent = '目標 ' + goalHours + ' 小時';
  ringBg.style.setProperty('--pct', pct);

  startLabel.textContent = fmtDateShort(state.startTime);
  endLabel.textContent = fmtDateShort(state.startTime + goalHours * 3600 * 1000);

  const phase = getPhase(elapsedHours);
  phaseTitle.textContent = `${phase.title}（第 ${Math.floor(elapsedHours)} 小時）`;
  phaseDesc.textContent = phase.desc;

  renderBadges(elapsedHours, goalHours);
  checkMilestoneNotify(elapsedHours);
}

let notifiedMilestones = {};
function checkMilestoneNotify(elapsedHours) {
  MILESTONES.forEach((m) => {
    if (elapsedHours >= m && !notifiedMilestones[m]) {
      notifiedMilestones[m] = true;
      notify(`已達成 ${m} 小時！${getPhase(m).title}`);
    }
  });
}

let lastStartFieldRefreshSec = -1;
function tick() {
  updateDisplay();
  const nowSec = Math.floor(Date.now() / 1000);
  if (!state.running && !startInputManuallyEdited && document.activeElement !== startInput && nowSec !== lastStartFieldRefreshSec) {
    lastStartFieldRefreshSec = nowSec;
    startInput.value = toLocalDatetimeInputValue(Date.now());
  }
  requestAnimationFrame(tick);
}

  const startMs = (startInputManuallyEdited && startInput.value) ? new Date(startInput.value).getTime() : Date.now();

  state.startTime = startMs;
  state.goalHours = Number(goalSelect.value) || 24;

  if (confirm('確定要結束這次斷食嗎？')) {
    const endTime = Date.now();
    const durationMs = endTime - state.startTime;
    const durationHours = durationMs / 3600000;
    fastingHistory.unshift({
      id: 'fast_' + endTime,
      startTime: state.startTime,
      endTime,
      durationMs,
      durationHours,
      goalHours: Number(state.goalHours || goalSelect.value || 24)
    });
    saveFastingHistory();
    renderFastingHistory();
    state.running = false;
    state.startTime = null;

/* ---------------- 趨勢圖表 ---------------- */
const CHART_W = 300;
const CHART_H = 60;
const MAX_POINTS = 20;

function buildPolyline(values, w, h, min, max) {
  if (values.length === 0) return '';
  const range = (max - min) || 1;
  const stepX = values.length > 1 ? w / (values.length - 1) : 0;
  return values.map((v, i) => {
    const x = values.length > 1 ? i * stepX : w / 2;
    const y = h - ((v - min) / range) * (h - 8) - 4;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
}

function makeSparklineSVG(seriesList) {
  const allVals = seriesList.flatMap(s => s.values);
  if (allVals.length === 0) return null;
  const min = Math.min(...allVals);
  const max = Math.max(...allVals);
  let svg = `<svg class="sparkline" viewBox="0 0 ${CHART_W} ${CHART_H}" preserveAspectRatio="none">`;
  seriesList.forEach(s => {
    if (s.values.length === 0) return;
    const pts = buildPolyline(s.values, CHART_W, CHART_H, min, max);
    svg += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />`;
    const lastX = s.values.length > 1 ? CHART_W : CHART_W / 2;
    const range = (max - min) || 1;
    const lastY = CHART_H - ((s.values[s.values.length - 1] - min) / range) * (CHART_H - 8) - 4;
    svg += `<circle cx="${lastX}" cy="${lastY.toFixed(1)}" r="3.2" fill="${s.color}" />`;
  });
  svg += `</svg>`;
  return svg;
}

function buildChartCard(label, unit, records, valueKey, color, latestFormatter) {
  const filtered = records.filter(r => r[valueKey] != null).sort((a, b) => a.time - b.time).slice(-MAX_POINTS);
  const card = document.createElement('div');
  card.className = 'chart-card';

  const head = document.createElement('div');
  head.className = 'chart-head';
  const labelEl = document.createElement('div');
  labelEl.className = 'chart-label';
  labelEl.textContent = label;
  head.appendChild(labelEl);

  const latestEl = document.createElement('div');
  latestEl.className = 'chart-latest';
  latestEl.style.color = color;
  if (filtered.length > 0) {
    const last = filtered[filtered.length - 1];
    latestEl.textContent = latestFormatter(last) + ' ' + unit;
  } else {
    latestEl.textContent = '—';
  }
  head.appendChild(latestEl);
  card.appendChild(head);

  if (filtered.length < 2) {
    const empty = document.createElement('div');
    empty.className = 'chart-empty';
    empty.textContent = filtered.length === 0 ? '尚無資料，記錄兩筆以上即可看到趨勢' : '再記錄一筆即可畫出趨勢線';
    card.appendChild(empty);
    return card;
  }

  const svgHtml = makeSparklineSVG([{ values: filtered.map(r => r[valueKey]), color }]);
  const wrap = document.createElement('div');
  wrap.innerHTML = svgHtml;
  card.appendChild(wrap.firstChild);

  return card;
}

  const card = document.createElement('div');

function buildStatsCard(label, unit, records, valueKey, icon) {
  const card = document.createElement('div');
  card.className = 'stats-card';
  
  const labelEl = document.createElement('div');
  labelEl.className = 'stats-label';
  labelEl.textContent = `${icon} ${label}`;
  card.appendChild(labelEl);
  
  const filtered = records.filter(r => r[valueKey] != null);
  if (filtered.length === 0) {
    card.innerHTML += '<div class="stats-value">—</div><div class="stats-change">無數據</div>';
    return card;
  }
  
  const values = filtered.map(r => r[valueKey]);
  const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
  const max = Math.max(...values).toFixed(1);
  const min = Math.min(...values).toFixed(1);
  const latest = values[values.length - 1].toFixed(1);
  const prev = values.length > 1 ? values[values.length - 2].toFixed(1) : latest;
  const change = (latest - prev).toFixed(1);
  const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : '';
  const changeSymbol = change > 0 ? '↑' : change < 0 ? '↓' : '→';
  
  const valueEl = document.createElement('div');
  valueEl.className = 'stats-value';
  valueEl.textContent = `${latest} ${unit}`;
  card.appendChild(valueEl);
  
  const statsEl = document.createElement('div');
  statsEl.className = 'stats-change';
  statsEl.innerHTML = `
    <div>平均: ${avg}</div>
    <div class="${changeClass}">最近: ${changeSymbol} ${Math.abs(change)}</div>
    <div style="font-size:10px; color:var(--text-faint);">高:${max} 低:${min}</div>
  `;
  card.appendChild(statsEl);
  
  return card;
}

function renderStatsSummary() {
  const statsSummary = document.getElementById('statsSummary');
  statsSummary.innerHTML = '';
  
  if (bioRecords.length === 0) return;
  
  statsSummary.appendChild(buildStatsCard('體重', 'kg', bioRecords, 'weight', '⚖'));
  statsSummary.appendChild(buildStatsCard('心率', 'bpm', bioRecords, 'hr', '♥'));
  statsSummary.appendChild(buildStatsCard('血糖', 'mg/dL', bioRecords, 'glucose', '◆'));
  
  const bpFiltered = bioRecords.filter(r => r.sys != null && r.dia != null);
  if (bpFiltered.length > 0) {
    const sysValues = bpFiltered.map(r => r.sys);
    const diaValues = bpFiltered.map(r => r.dia);
    const sysAvg = (sysValues.reduce((a, b) => a + b, 0) / sysValues.length).toFixed(0);
    const diaAvg = (diaValues.reduce((a, b) => a + b, 0) / diaValues.length).toFixed(0);
    
    const bpCard = document.createElement('div');
    bpCard.className = 'stats-card';
    const labelEl = document.createElement('div');
    labelEl.className = 'stats-label';
    labelEl.textContent = '▲ 血壓';
    bpCard.appendChild(labelEl);
    
    const latest = bpFiltered[bpFiltered.length - 1];
    const valueEl = document.createElement('div');
    valueEl.className = 'stats-value';
    valueEl.textContent = `${latest.sys}/${latest.dia}`;
    bpCard.appendChild(valueEl);
    
    const statsEl = document.createElement('div');
    statsEl.className = 'stats-change';
    statsEl.innerHTML = `<div>平均: ${sysAvg}/${diaAvg}</div><div style="font-size:10px;">共 ${bpFiltered.length} 筆</div>`;
    bpCard.appendChild(statsEl);
    
    statsSummary.appendChild(bpCard);
  }
}

function fmtDurationHours(ms) {
  const totalHours = ms / 3600000;
  if (totalHours >= 24) return `${(totalHours / 24).toFixed(1)} 天`;
  return `${totalHours.toFixed(1)} 小時`;
}

function renderFastingHistory() {
  if (!historyList) return;
  historyList.innerHTML = '';
  if (fastingHistory.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = '尚無斷食紀錄，開始你的第一段斷食吧';
    historyList.appendChild(empty);
    return;
  }

  const sorted = [...fastingHistory].sort((a, b) => b.endTime - a.endTime);
  sorted.forEach((entry) => {
    const item = document.createElement('div');
    item.className = 'history-item';

    const header = document.createElement('div');
    header.className = 'history-header';

    const date = document.createElement('div');
    date.className = 'history-date';
    date.textContent = `${fmtDateShort(entry.startTime)} → ${fmtDateShort(entry.endTime)}`;

    const duration = document.createElement('div');
    duration.className = 'history-duration';
    duration.textContent = fmtDurationHours(entry.durationMs);

    header.appendChild(date);
    header.appendChild(duration);
    item.appendChild(header);

    const meta = document.createElement('div');
    meta.className = 'history-meta';
    meta.textContent = `目標 ${entry.goalHours} 小時 · ${entry.goalHours <= entry.durationHours ? '達成目標' : '未達目標'}`;
    item.appendChild(meta);

    historyList.appendChild(item);
  });
}

function renderCharts() {
  renderStatsSummary();
  renderFastingHistory();
  chartGrid.innerHTML = '';
  if (bioRecords.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'chart-empty';
    empty.textContent = '尚無任何記錄，先到「記錄」頁新增體重 / 血糖 / 血壓 / 心跳吧';
    chartGrid.appendChild(empty);
    return;
  }
  chartGrid.appendChild(buildChartCard('體重', 'kg', bioRecords, 'weight', '#60a5fa', r => r.weight));
  chartGrid.appendChild(buildChartCard('心跳', 'bpm', bioRecords, 'hr', '#fb7185', r => r.hr));
  chartGrid.appendChild(buildChartCard('血糖', 'mg/dL', bioRecords, 'glucose', '#a78bfa', r => r.glucose));
  chartGrid.appendChild(buildBpChartCard(bioRecords));
}

/* ---------------- 離線狀態 ---------------- */
function updateOnlineStatus() { offlineBadge.classList.toggle('show', !navigator.onLine); }
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateDisplay(); });

/* ---------------- Service Worker ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

/* ---------------- 初始化 ---------------- */
loadState();
goalSelect.value = String(state.goalHours || 120);
startInput.value = toLocalDatetimeInputValue(state.startTime || Date.now());
updateOnlineStatus();
renderBioList();
renderCharts();
updateDisplay();
tick();
</script>
</body>
</html>
